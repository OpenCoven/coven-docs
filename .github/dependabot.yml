version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      fumadocs:
        patterns:
          - "fumadocs-*"
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react*"
      verification-tooling:
        patterns:
          - puppeteer
          - mermaid
          - jsdom
          - next-validate-link

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: America/Chicago
    open-pull-requests-limit: 5
