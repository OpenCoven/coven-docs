name: Docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify documentation release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify upstream source freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_DRIFT_REPORT_PATH: output/docs-source-drift.json
        run: pnpm check:source-drift

      - name: Install Chrome for browser certification
        run: pnpm exec puppeteer browsers install chrome

      - name: Verify docs
        run: pnpm verify

      - name: Confirm clean generated tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Verification changed the working tree:"
            git status --short
            git diff --stat
            exit 1
          fi

      - name: Upload browser and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-certification-${{ github.run_id }}
          path: |
            output/docs-smoke/
            output/docs-source-drift.json
          if-no-files-found: warn
          retention-days: 30
