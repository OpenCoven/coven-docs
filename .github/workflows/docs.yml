name: Docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Verify upstream documentation source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test freshness and release-gate invariants
        run: node --test scripts/check-source-drift.test.mjs scripts/docs-release-gate.test.mjs

      - name: Validate source lock
        run: node scripts/check-source-lock.mjs

      - name: Verify upstream source freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_DRIFT_REPORT_PATH: output/docs-source-drift.json
        run: node scripts/check-source-drift.mjs

      - name: Upload source-drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-source-drift-${{ github.run_id }}
          path: output/docs-source-drift.json
          if-no-files-found: warn
          retention-days: 30

  browser:
    name: Certify documentation build and browser behavior
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for browser certification
        run: pnpm exec puppeteer browsers install chrome

      - name: Verify docs
        run: pnpm verify

      - name: Confirm clean generated tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Verification changed the working tree:"
            git status --short
            git diff --stat
            exit 1
          fi

      - name: Upload browser and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-certification-${{ github.run_id }}
          path: output/docs-smoke/
          if-no-files-found: warn
          retention-days: 30

  verify:
    # Preserve the canonical required-check name while collecting both lanes.
    name: Verify documentation release
    needs: [freshness, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require both evidence jobs to succeed
        env:
          DOCS_FRESHNESS_RESULT: ${{ needs.freshness.result }}
          DOCS_BROWSER_RESULT: ${{ needs.browser.result }}
        run: node scripts/docs-release-gate.mjs
