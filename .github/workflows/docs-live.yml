name: Docs live

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-live-production
  cancel-in-progress: true

jobs:
  production:
    name: Verify production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify live routes and deployment freshness
        id: production
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ github.ref_name == 'main' && github.sha || '' }}
          DOCS_PRODUCTION_ATTEMPTS: ${{ github.event_name == 'push' && '20' || '2' }}
          DOCS_PRODUCTION_INTERVAL_MS: ${{ github.event_name == 'push' && '30000' || '5000' }}
          DOCS_REPORT_PATH: output/docs-production.json
        run: node scripts/check-production.mjs

      - name: Open or update production incident
        if: steps.production.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          mkdir -p output
          cat > output/production-incident.md <<EOF
          The public Coven documentation failed its scheduled live and freshness contract.

          - Expected commit: \`${EXPECTED_SHA}\`
          - Workflow run: ${DOCS_RUN_URL}
          - Production URL: https://docs.opencoven.ai

          Inspect the attached \`docs-production.json\` evidence, the Vercel deployment, and \`/build.txt\`. Restore production by fixing or reverting the source; do not bypass repository verification.
          EOF
          node scripts/sync-automation-issue.mjs \
            --key production \
            --state open \
            --title "docs-live: production documentation is stale or unavailable" \
            --body-file output/production-incident.md

      - name: Resolve recovered production incident
        if: steps.production.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync-automation-issue.mjs \
            --key production \
            --state resolved \
            --title "docs-live: production documentation is stale or unavailable"

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-production-${{ github.run_id }}
          path: output/docs-production.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when production is stale
        if: steps.production.outcome == 'failure'
        run: exit 1
