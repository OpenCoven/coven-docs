openapi: 3.1.0
info:
  title: Coven Daemon API
  version: coven.daemon.v1
  summary: Local HTTP-over-Unix-socket control plane for the Coven daemon.
  description: |
    The Coven daemon exposes an HTTP/1.1 API over a Unix domain socket at
    `$COVEN_HOME/coven.sock` (default `~/.coven/coven.sock`). Clients connect
    to the socket file directly. The daemon can additionally bind a TCP
    listener with `coven daemon serve --tcp <addr>`, guarded to loopback bind
    addresses and loopback (or explicitly `--allow-host`-listed) `Host` /
    `Origin` headers. There is no TLS and no token-based auth (no Bearer /
    JWT / API-key / cookie schemes) on either transport.

    ### Spec scope

    This document covers the **stable public `coven.daemon.v1` contract**:
    the meta/handshake, session, event, and action routes. The daemon also
    serves a broader first-party control plane under the same `/api/v1`
    prefix (`/overview`, `/cast`, `/cast-codes`, `/familiars/*`,
    `/threads/*`, `/skills/*`, `/coven-calls`, `/memory`, `/research`,
    `/store/vacuum`, `/travel/*`, `/scheduler/*`, `/hub/*`,
    `/capabilities/harnesses`, `/capabilities/{harnessId}`). Those routes
    are used by first-party clients (Cave, CastCodes), may evolve without a
    version bump, and are **intentionally out of scope for this spec** — see
    the [control-plane surface map](/docs/reference/api#control-plane-surface-map).

    ### Trust model

    Authentication is **file-system based**: anyone with read/write permission
    on the socket can act as a client. Keep `$COVEN_HOME` private to the owning
    user. See [Authentication and local access](/docs/reference/auth) for the
    full posture.

    ### Required handshake

    1. `GET /api/v1/health` — confirm `apiVersion: "coven.daemon.v1"`.
    2. `GET /api/v1/capabilities` — discover available adapters and action ids.
    3. Use versioned `/api/v1/*` routes only.

    ### Versioning

    The current contract is the named `coven.daemon.v1` contract under
    `/api/v1`. Additive fields are allowed inside `v1`; breaking changes require
    a new version prefix. Always branch behavior on `error.code` rather than
    message text.

    ### Try It panels

    The interactive Try It buttons on this site forward requests through a
    Next.js route handler to your local `$COVEN_HOME/coven.sock`. They only
    work when you are running this docs site on the same machine as a live
    daemon. Start one with `coven daemon start` and verify with
    `coven daemon status`.
  contact:
    name: OpenCoven
    url: https://github.com/OpenCoven
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /api/coven-proxy/api/v1
    description: Local daemon via the docs-site Unix socket bridge.

security: []

tags:
  - name: Meta
    description: Handshake, capability discovery, and version metadata. Call `/health` before assuming any other response shape.
  - name: Sessions
    description: Launch, inspect, and control harness sessions.
  - name: Events
    description: Append-only event log for one session.
  - name: Actions
    description: Control-plane action router. Only known action ids are accepted; unknown ids fail closed.

paths:
  /api-version:
    get:
      tags: [Meta]
      operationId: getApiVersion
      summary: Read route-prefix version metadata
      description: |
        Returns the route-prefix version and the set of supported route-prefix
        versions. Lower-level than `/health` — use this only when debugging
        route-prefix support.

        For normal client handshakes, use [`GET /health`](#tag/meta/get/health)
        instead.
      responses:
        '200':
          description: Route-prefix version metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersion'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Daemon health and contract handshake
      description: |
        Required compatibility handshake. Returns the named API contract
        version (`coven.daemon.v1`), the installed Coven binary version,
        machine-readable capabilities, and optional daemon metadata.

        Clients should treat `apiVersion: "coven.daemon.v1"` as the stable
        contract guard. `covenVersion` is diagnostics-only — do not branch
        compatibility on a binary version alone.

        When no daemon metadata is available, `daemon` is `null`.
      responses:
        '200':
          description: Daemon is reachable and ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /capabilities:
    get:
      tags: [Meta]
      operationId: getCapabilities
      summary: Discover daemon and control-plane capabilities
      description: |
        Returns capability ids, adapter ownership, availability, policy hints,
        and the action ids each capability exposes. Use this before hard-coding
        action ids or assuming a harness is available.
      responses:
        '200':
          description: Catalog of capabilities advertised by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /actions:
    post:
      tags: [Actions]
      operationId: routeAction
      summary: Route a control-plane action
      description: |
        Accepts a structured intent envelope. The daemon routes only known
        action ids; unknown actions fail closed before any adapter can run.

        Immediately-completed safe actions return `200` with an event-shaped
        payload that clients can render optimistically or fold into later
        event streams.

        Known action ids (as of `coven.daemon.v1`):
        - `coven.capabilities.refresh`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Action was accepted and completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/UnknownAction'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List active sessions
      description: |
        Returns all active, non-archived sessions known to this daemon.

        This endpoint accepts no filter parameters: archived sessions are
        always excluded, and there is no `archived` query flag. Archived
        records are surfaced through the CLI (`coven sessions --all`) and
        TUI, which read the session store directly.
      responses:
        '200':
          description: List of active sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionRecord'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Launch a session
      description: |
        Creates a session record and spawns the requested harness inside a PTY.
        The daemon validates `projectRoot` and `cwd` (cwd must canonicalize
        inside the project root), allowlists `harness`, and emits output/exit
        events to the session's event log.

        Provider credentials are NOT part of this request. Codex, Claude Code,
        and future harnesses keep their own local auth flows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created and harness launched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRecord'
        '400':
          description: Request was malformed or violated project-root boundaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                projectRootViolation:
                  summary: cwd outside project root
                  value:
                    error:
                      code: project_root_violation
                      message: cwd must canonicalize inside project root.
                      details:
                        projectRoot: /Users/example/project
                        cwd: /tmp/somewhere-else
                invalidHarness:
                  summary: Unsupported harness id
                  value:
                    error:
                      code: invalid_request
                      message: Harness "gpt-9" is not supported.
                      details:
                        harness: gpt-9
                        supportedHarnesses: [codex, claude, coven-code, copilot]
                unknownFamiliar:
                  summary: Unknown familiar id
                  value:
                    error:
                      code: unknown_familiar
                      message: Familiar "charm" is not configured.
                      details:
                        familiarId: charm
        '500':
          description: The harness could not be launched. The session row is marked `failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: launch_failed
                  message: Could not launch harness session.
                  details:
                    sessionId: session-1
        '503':
          $ref: '#/components/responses/RuntimeUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /sessions/external:
    post:
      tags: [Sessions]
      operationId: registerExternalSession
      summary: Register an externally-launched session
      description: |
        Registers a session that was launched outside the daemon (for example
        by the coven engine TUI) so it appears in the shared session ledger.
        The daemon does not own a PTY for external sessions — it only holds
        the ledger row, which is created with `status: running` and
        `external: true`.

        Registration is idempotent on `id`: re-registering an existing
        external session returns `200` with the persisted record instead of
        failing. If a **daemon-managed** session already holds the id, the
        request is rejected with `409 session_id_conflict`.

        Finish an external session with
        [`POST /sessions/{id}/complete`](#tag/sessions/post/sessions/{id}/complete).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterExternalSessionRequest'
      responses:
        '201':
          description: External session registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRecord'
        '200':
          description: A session with this id was already registered; the persisted record is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRecord'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: A daemon-managed session already holds this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: session_id_conflict
                  message: A daemon-managed session with this id already exists.
                  details:
                    sessionId: session-1
        default:
          $ref: '#/components/responses/UnexpectedError'

  /sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Fetch one session
      description: |
        Returns the session record for the given id. Returns
        `404 session_not_found` for unknown ids.
      responses:
        '200':
          description: The session record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRecord'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /sessions/{id}/input:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Sessions]
      operationId: sendSessionInput
      summary: Forward input to a live session
      description: |
        Forwards an input chunk to the PTY of a daemon-verified live session.
        Accepted input is appended to the session's event log as an `input`
        event.

        Only `running` sessions accept input. Completed, failed, killed,
        archived, or orphaned sessions are replay/log surfaces — sending input
        to them returns `409 session_not_live`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionInputRequest'
      responses:
        '202':
          description: Input was accepted and forwarded to the PTY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionActionResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/SessionNotLive'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /sessions/{id}/kill:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Sessions]
      operationId: killSession
      summary: Kill a live session
      description: |
        Terminates the harness process of a daemon-verified live session. The
        daemon transitions the session status to `killed` and writes a `kill`
        event to the session's event log.

        Killing is not the same as deleting history. Use the lifecycle commands
        `coven archive`, `coven summon`, and `coven sacrifice` for record
        management.
      responses:
        '202':
          description: Kill request was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionActionResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/SessionNotLive'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /sessions/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Sessions]
      operationId: completeExternalSession
      summary: Complete an externally-registered session
      description: |
        Marks an externally-registered session finished. A non-zero `exitCode`
        transitions the session to `failed`; zero or a missing `exitCode`
        transitions it to `completed`. The body may be omitted entirely.

        Only valid for sessions registered via
        [`POST /sessions/external`](#tag/sessions/post/sessions/external).
        Daemon-managed sessions return `422 not_external_session` — use
        [`POST /sessions/{id}/kill`](#tag/sessions/post/sessions/{id}/kill)
        for those instead.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteExternalSessionRequest'
      responses:
        '200':
          description: The updated session record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRecord'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '422':
          description: The session exists but is daemon-managed, not external.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: not_external_session
                  message: POST /sessions/<id>/complete is only valid for externally-registered sessions. Use POST /sessions/<id>/kill for daemon-managed sessions.
                  details:
                    sessionId: session-1
        default:
          $ref: '#/components/responses/UnexpectedError'

  /sessions/{id}/log:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getSessionLog
      summary: Read a rendered log view of one session
      description: |
        Returns the session's full event stream rendered as display-ready log
        lines (`ts`, `level`, `message`). Payloads are previewed and
        truncated for display — use
        [`GET /sessions/{id}/events`](#tag/events/get/sessions/{id}/events)
        when you need raw event payloads or cursor-based pagination.
      responses:
        '200':
          description: Rendered log lines, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogLine'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /sessions/{id}/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: artifactId
        in: path
        required: true
        description: Id of the sensitive artifact recorded for this session.
        schema:
          type: string
          examples: [artifact-1]
    get:
      tags: [Sessions]
      operationId: getSessionArtifact
      summary: Fetch a sensitive session artifact
      description: |
        Returns the decrypted payload of one sensitive artifact (redacted
        material that was moved out of the plain event log).

        Two explicit opt-ins gate this read: the request must pass `raw=1`
        (otherwise `400 raw_artifact_requires_raw_flag`), and raw artifact
        persistence must be enabled in the daemon's privacy configuration
        (otherwise `403 raw_artifacts_disabled`). Expired artifacts return
        `404 artifact_expired`.
      parameters:
        - name: raw
          in: query
          required: true
          description: Must be `1`. Explicit acknowledgement that the caller wants raw (unredacted) artifact content.
          schema:
            type: string
            enum: ['1']
            examples: ['1']
      responses:
        '200':
          description: The decrypted artifact payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionArtifact'
        '400':
          description: The `raw=1` acknowledgement flag is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: raw_artifact_requires_raw_flag
                  message: Raw artifact retrieval requires raw=1.
                  details:
                    sessionId: session-1
                    artifactId: artifact-1
        '403':
          description: Raw artifact persistence is not enabled in the daemon's privacy configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: raw_artifacts_disabled
                  message: Raw artifact persistence is not enabled.
                  details:
                    sessionId: session-1
                    artifactId: artifact-1
        '404':
          description: The session or artifact does not exist, or the artifact has expired (`session_not_found`, `artifact_not_found`, or `artifact_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: artifact_not_found
                  message: Sensitive artifact was not found.
                  details:
                    sessionId: session-1
                    artifactId: artifact-1
        default:
          $ref: '#/components/responses/UnexpectedError'

  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: Read append-only session events
      description: |
        Returns a page of append-only events for a single session. Events have
        a monotonic `seq` value; persist `nextCursor.afterSeq` to resume
        incremental reads across daemon restarts.

        Output and exit data remain replayable via events even after the
        harness process exits — the daemon's event log is the source of truth
        for session history.
      parameters:
        - name: sessionId
          in: query
          required: true
          description: Session id whose events should be returned. Requests without it fail with `400 invalid_request`.
          schema:
            type: string
            examples: [session-1]
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/AfterEventId'
        - $ref: '#/components/parameters/EventsLimit'
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /sessions/{id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Events]
      operationId: listSessionEvents
      summary: Read one session's events (path-scoped)
      description: |
        Path-scoped form of [`GET /events`](#tag/events/get/events): identical
        cursor parameters and response shape, with the session id taken from
        the path instead of a `sessionId` query parameter.
      parameters:
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/AfterEventId'
        - $ref: '#/components/parameters/EventsLimit'
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: The session id (stable across daemon restarts).
      schema:
        type: string
        examples: [session-1]
    AfterSeq:
      name: afterSeq
      in: query
      required: false
      description: |
        Preferred cursor. Returns events with `seq > afterSeq`; pass
        `nextCursor.afterSeq` from the previous page to resume reading.
        Takes precedence over `afterEventId` when both are supplied.
        Non-integer values fail with `400 invalid_request`.
      schema:
        type: integer
        minimum: 0
        examples: [41]
    AfterEventId:
      name: afterEventId
      in: query
      required: false
      description: |
        Compatibility cursor for clients that stored event ids instead of
        sequence numbers. The daemon resolves the id to its sequence position
        and returns events after it. Ignored when `afterSeq` is also
        supplied; unknown ids read from the start of the log.
      schema:
        type: string
        examples: [event-41]
    EventsLimit:
      name: limit
      in: query
      required: false
      description: |
        Maximum number of events to return. Out-of-range values are clamped
        to 1–1000 rather than rejected; non-integer values fail with
        `400 invalid_request`. When omitted, all events after the cursor are
        returned in one page. `hasMore` in the response is only meaningful
        when a limit is set — it is `true` when the page filled the limit.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        examples: [200]

  responses:
    InvalidRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: invalid_request
              message: Required field "sessionId" is missing.
              details:
                field: sessionId
    UnknownAction:
      description: The action id is not known to this daemon.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: invalid_request
              message: Unknown control-plane action id.
              details:
                action: coven.unknown.thing
    SessionNotFound:
      description: No session exists with the given id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: session_not_found
              message: Session was not found.
              details:
                sessionId: session-1
    SessionNotLive:
      description: |
        The session exists but cannot accept input or kill — it is not running
        in this daemon (e.g., already completed, failed, killed, orphaned, or
        archived).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: session_not_live
              message: Session is not live.
              details:
                sessionId: session-1
                status: completed
    RuntimeUnavailable:
      description: The session runtime is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: runtime_unavailable
              message: Session runtime is unavailable.
              details: {}
    UnexpectedError:
      description: |
        Catch-all for any other failure. The daemon may return `internal_error`
        (500) for unhandled exceptions, `not_found` (404) for unknown routes,
        or — through the docs-site bridge — `daemon_unreachable` (503) when no
        daemon is listening on the socket. Branch on `error.code`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: internal_error
              message: Unexpected internal daemon error.
              details: {}

  schemas:
    ApiVersion:
      type: object
      description: Route-prefix version metadata. Distinct from the named contract version returned by `/health`.
      required: [apiVersion, supportedApiVersions]
      properties:
        apiVersion:
          type: string
          description: The currently-served route-prefix version.
          examples: [v1]
        supportedApiVersions:
          type: array
          description: All route-prefix versions this daemon will serve.
          items:
            type: string
          examples:
            - [v1]
      examples:
        - apiVersion: v1
          supportedApiVersions: [v1]

    Health:
      type: object
      description: Daemon health and contract handshake.
      required: [ok, apiVersion, covenVersion, capabilities, daemon]
      properties:
        ok:
          type: boolean
          description: Liveness flag. Always `true` when the response is delivered.
        apiVersion:
          type: string
          description: Named API contract version. Compare against `coven.daemon.v1`.
          const: coven.daemon.v1
        covenVersion:
          type: string
          description: Installed Coven binary version (e.g., `0.0.0`). Diagnostics-only.
        capabilities:
          $ref: '#/components/schemas/HealthCapabilities'
        daemon:
          oneOf:
            - $ref: '#/components/schemas/DaemonMetadata'
            - type: 'null'
          description: Daemon process metadata, or `null` when unavailable.
        hub:
          $ref: '#/components/schemas/HubHealth'
          description: Hub control-plane summary (role and node availability). Omitted when the response is built without store access.
      examples:
        - ok: true
          apiVersion: coven.daemon.v1
          covenVersion: 0.0.0
          capabilities:
            sessions: true
            events: true
            travel: true
            scheduler: true
            hub: true
            executorDispatch: true
            eventCursor: sequence
            structuredErrors: true
          daemon:
            pid: 12345
            startedAt: 2026-05-09T12:00:00Z
            socket: /Users/example/.coven/coven.sock

    HealthCapabilities:
      type: object
      description: Machine-readable capability flags. Additional fields may be added in `v1`; clients should ignore unknown keys.
      required: [sessions, events, travel, scheduler, hub, executorDispatch, eventCursor, structuredErrors]
      properties:
        sessions:
          type: boolean
          description: Whether `/sessions` endpoints are served.
        events:
          type: boolean
          description: Whether `/events` is served.
        travel:
          type: boolean
          description: Whether the travel-profile control-plane routes (`/travel/*`) are served.
        scheduler:
          type: boolean
          description: Whether the scheduler control-plane routes (`/scheduler/*`) are served.
        hub:
          type: boolean
          description: Whether the hub control-plane routes (`/hub/*`) are served.
        executorDispatch:
          type: boolean
          description: Whether hub executor dispatch (`/hub/nodes/{id}/dispatch`) is supported.
        eventCursor:
          type: string
          description: Event cursor strategy. Only `sequence` is defined in `coven.daemon.v1`.
          enum: [sequence]
        structuredErrors:
          type: boolean
          description: Whether failure responses use the `ErrorEnvelope` shape (always `true` in `coven.daemon.v1`).

    HubHealth:
      type: object
      description: Hub control-plane summary embedded in the health response.
      required: [role, hubId, nodesTotal, nodesAvailable]
      properties:
        role:
          type: string
          description: This daemon's hub role (e.g., `hub`).
        hubId:
          type: string
          description: Stable id of the hub this daemon belongs to.
        nodesTotal:
          type: integer
          minimum: 0
          description: Total registered executor nodes.
        nodesAvailable:
          type: integer
          minimum: 0
          description: Executor nodes currently available for dispatch.

    DaemonMetadata:
      type: object
      description: Process metadata for the daemon currently serving this socket.
      required: [pid, startedAt, socket]
      properties:
        pid:
          type: integer
          minimum: 1
          description: Daemon process id on this host.
        startedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp of when the daemon began serving.
        socket:
          type: string
          description: Absolute path to the Unix socket that served the request.

    Capabilities:
      type: object
      description: Catalog of capabilities advertised by this daemon.
      required: [capabilities]
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
      examples:
        - capabilities:
            - id: coven.control.actions
              label: Coven control-plane action router
              adapter: coven-daemon
              status: available
              policy: allow
              actions: [coven.capabilities.refresh]
            - id: desktop.automation
              label: Desktop automation adapters
              adapter: desktop-use
              status: planned
              policy: requiresApproval
              actions: []

    Capability:
      type: object
      required: [id, label, adapter, status, policy, actions]
      properties:
        id:
          type: string
          description: Stable capability id (reverse-DNS style).
          examples: [coven.control.actions]
        label:
          type: string
          description: Human-readable capability label.
          examples: [Coven control-plane action router]
        adapter:
          type: string
          description: Name of the adapter that owns this capability.
          examples: [coven-daemon]
        status:
          type: string
          description: Whether the capability is usable right now.
          enum: [available, planned]
        policy:
          type: string
          description: Policy hint clients should respect before invoking actions.
          enum: [allow, requiresApproval]
        actions:
          type: array
          description: Action ids this capability exposes via `/actions`.
          items:
            type: string

    ActionRequest:
      type: object
      required: [action, origin, args]
      properties:
        action:
          type: string
          description: Known control-plane action id.
          examples: [coven.capabilities.refresh]
        origin:
          type: string
          description: Caller identifier, for audit and event correlation.
          examples: [coven-client]
        args:
          type: object
          description: Action-specific arguments. May be empty.
          additionalProperties: true
      examples:
        - action: coven.capabilities.refresh
          origin: coven-client
          args: {}

    ActionResponse:
      type: object
      required: [ok, accepted, action, status, event]
      properties:
        ok:
          type: boolean
        accepted:
          type: boolean
        action:
          type: string
          description: Echo of the action id that was routed.
        status:
          type: string
          enum: [completed]
          description: Lifecycle status of the action. Only `completed` is returned for immediately-completed safe actions in `coven.daemon.v1`.
        event:
          $ref: '#/components/schemas/ActionEvent'
      examples:
        - ok: true
          accepted: true
          action: coven.capabilities.refresh
          status: completed
          event:
            kind: capabilities.refreshed
            action: coven.capabilities.refresh
            origin: coven-client
            payload:
              capabilities: 3

    ActionEvent:
      type: object
      required: [kind, action, origin, payload]
      properties:
        kind:
          type: string
          description: Event kind that this action produced (e.g., `capabilities.refreshed`).
        action:
          type: string
          description: Echo of the action id.
        origin:
          type: string
          description: Echo of the caller identifier.
        payload:
          type: object
          description: Action-specific result payload.
          additionalProperties: true

    SessionRecord:
      type: object
      description: |
        The Rust daemon's `SessionRecord` shape. Field names use snake_case.
      required:
        - id
        - project_root
        - harness
        - title
        - status
        - exit_code
        - archived_at
        - created_at
        - updated_at
        - conversation_id
        - familiar_id
        - labels
        - visibility
        - external
        - transcript_path
      properties:
        id:
          type: string
          examples: [session-1]
        project_root:
          type: string
          description: Absolute canonical project root path on this host.
          examples: [/Users/example/project]
        harness:
          type: string
          description: Harness id this session was launched with.
          examples: [codex]
        title:
          type: string
          description: Human-readable session title.
        status:
          $ref: '#/components/schemas/SessionStatus'
        exit_code:
          type: [integer, 'null']
          description: Process exit code if the harness exited; `null` while running or not yet exited.
          examples: [null]
        archived_at:
          type: [string, 'null']
          format: date-time
          description: ISO-8601 timestamp of archival, or `null` if active.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        conversation_id:
          type: [string, 'null']
          description: |
            Optional grouping id so multi-turn chat conversations show as one
            thread in `/sessions` instead of one row per turn. `null` for
            ungrouped one-off runs.
        familiar_id:
          type: [string, 'null']
          description: |
            Familiar id this session was launched with (e.g. via
            `coven run --familiar <id>`). `null` for direct launches without
            the flag and for legacy sessions.
        labels:
          type: array
          description: Client-facing labels attached to this session. Empty when unlabeled.
          items:
            type: string
        visibility:
          type: string
          description: Session visibility. Defaults to `private`.
          examples: [private]
        external:
          type: boolean
          description: |
            `true` when the session was launched outside the daemon (e.g. by
            the coven engine TUI) and registered via `POST /sessions/external`.
            The daemon does not own the PTY for external sessions; it only
            holds the ledger row.
        transcript_path:
          type: [string, 'null']
          description: |
            Absolute path to the transcript file written by an external
            session. Only meaningful when `external` is `true`.
      examples:
        - id: session-1
          project_root: /Users/example/project
          harness: codex
          title: Fix failing tests
          status: running
          exit_code: null
          archived_at: null
          created_at: 2026-05-09T06:43:00Z
          updated_at: 2026-05-09T06:43:05Z
          conversation_id: null
          familiar_id: null
          labels: []
          visibility: private
          external: false
          transcript_path: null

    SessionStatus:
      type: string
      description: |
        Session lifecycle state machine values:
        - `created`: record exists, harness not yet running.
        - `running`: harness PTY is active.
        - `completed`: harness exited with code 0.
        - `failed`: setup or non-zero exit.
        - `killed`: live kill request was accepted.
        - `orphaned`: previous daemon stopped while running.
      enum: [created, running, completed, failed, killed, orphaned]

    CreateSessionRequest:
      type: object
      required: [projectRoot, harness, prompt]
      properties:
        projectRoot:
          type: string
          description: Absolute path to the project root. Will be canonicalized by the daemon.
          examples: [/Users/example/project]
        cwd:
          type: string
          description: Working directory for the harness. Must canonicalize inside `projectRoot`. Defaults to the project root when omitted.
          examples: [/Users/example/project]
        harness:
          type: string
          description: Supported harness id (`codex` or `claude` in `coven.daemon.v1`).
          examples: [codex]
        prompt:
          type: string
          description: Task text passed to the harness as its final argv argument.
          examples: [Fix the failing tests]
        title:
          type: string
          description: Readable session title for UI. Defaults to the prompt when omitted.
          examples: [Fix failing tests]
        model:
          type: string
          description: Optional namespaced model id (e.g. `openai/gpt-5.6-sol`). The harness adapter normalizes the provider prefix for the underlying CLI.
        launchMode:
          type: string
          description: How the harness process is driven. Defaults to `interactive`.
          enum: [interactive, nonInteractive, stream]
        conversation:
          type: [object, 'null']
          description: |
            Optional harness-native conversation hint. `mode: init` starts a
            new harness conversation with the given id; `mode: resume`
            resumes one. The id is forwarded verbatim to the harness CLI and
            is restricted to `[A-Za-z0-9._-]`.
          required: [mode, id]
          properties:
            mode:
              type: string
              enum: [init, resume]
            id:
              type: string
              pattern: '^[A-Za-z0-9._-]+$'
        conversationId:
          type: string
          description: Caller-supplied id used to group this session with other turns of the same chat conversation in `/sessions`. Independent of the harness CLI's own resume mechanism.
        familiarId:
          type: string
          description: Optional familiar id whose identity should be injected into the harness invocation. Unknown ids fail with `400 unknown_familiar`.
        callerFamiliarId:
          type: string
          description: Optional id of the familiar that spawned this session in a delegation; recorded in the Coven Calls ledger when set alongside `familiarId`.
      examples:
        - projectRoot: /Users/example/project
          cwd: /Users/example/project
          harness: codex
          prompt: Fix the failing tests
          title: Fix failing tests

    SessionInputRequest:
      type: object
      required: [data]
      properties:
        data:
          type: string
          description: Raw input bytes (UTF-8) to forward to the harness PTY. Include trailing newlines explicitly.
          examples:
            - "continue with the next failing test\n"
      examples:
        - data: "continue with the next failing test\n"

    RegisterExternalSessionRequest:
      type: object
      required: [id, projectRoot, harness]
      properties:
        id:
          type: string
          description: Caller-chosen session id. Registration is idempotent on this id.
          examples: [engine-session-1]
        projectRoot:
          type: string
          description: Absolute project root path the external session ran in.
          examples: [/Users/example/project]
        harness:
          type: string
          description: Harness id the external session used.
          examples: [codex]
        title:
          type: string
          description: Readable session title. Defaults to `External session` when omitted or blank.
        transcriptPath:
          type: string
          description: Absolute path to the transcript file written by the external session.
      examples:
        - id: engine-session-1
          projectRoot: /Users/example/project
          harness: codex
          title: Engine TUI run
          transcriptPath: /Users/example/.coven/transcripts/engine-session-1.jsonl

    CompleteExternalSessionRequest:
      type: object
      description: Optional completion metadata. An empty or missing body marks the session `completed`.
      properties:
        exitCode:
          type: integer
          description: Process exit code of the external session. Non-zero marks the session `failed`; zero (or omitted) marks it `completed`.
          examples: [0]
      examples:
        - exitCode: 0

    LogLine:
      type: object
      description: One display-ready log line rendered from a session event.
      required: [ts, level, message]
      properties:
        ts:
          type: string
          format: date-time
          description: Timestamp of the underlying event.
        level:
          type: string
          description: Render hint derived from the event kind (`input`/`output` map to `info`, `tool_call` to `tool`, `error` to `error`).
          enum: [info, tool, error]
        message:
          type: string
          description: Truncated, display-safe preview of the event payload.
      examples:
        - ts: 2026-05-09T06:43:10Z
          level: info
          message: "> continue with the next failing test"

    SessionArtifact:
      type: object
      description: Decrypted payload of one sensitive session artifact.
      required: [sessionId, artifactId, eventId, kind, payload]
      properties:
        sessionId:
          type: string
          examples: [session-1]
        artifactId:
          type: string
          examples: [artifact-1]
        eventId:
          type: string
          description: Id of the event this artifact was redacted from.
          examples: [event-1]
        kind:
          type: string
          description: Artifact kind recorded at redaction time.
        payload:
          description: Decrypted artifact content — JSON when the plaintext parses as JSON, otherwise a string.
      examples:
        - sessionId: session-1
          artifactId: artifact-1
          eventId: event-1
          kind: output
          payload:
            data: redacted material

    SessionActionResponse:
      type: object
      description: Acknowledgement that a live-session control request was accepted.
      required: [ok, accepted]
      properties:
        ok:
          type: boolean
        accepted:
          type: boolean
      examples:
        - ok: true
          accepted: true

    EventsResponse:
      type: object
      required: [events, nextCursor, hasMore]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventRecord'
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/EventCursor'
            - type: 'null'
          description: |
            Cursor to read the next page — `afterSeq` is the `seq` of the last
            event in this page. `null` when the page is empty.
            Persist `nextCursor.afterSeq` to resume across restarts.
        hasMore:
          type: boolean
          description: |
            Whether more events may follow the returned page. `true` when the
            page filled a requested `limit`; always `false` when `limit` was
            omitted (the full remainder was returned).
      examples:
        - events:
            - seq: 42
              id: event-1
              session_id: session-1
              kind: output
              payload_json: "{\"data\":\"hello\"}"
              created_at: 2026-05-09T06:43:10Z
          nextCursor:
            afterSeq: 42
          hasMore: false

    EventRecord:
      type: object
      required: [seq, id, session_id, kind, payload_json, created_at]
      properties:
        seq:
          type: integer
          minimum: 0
          description: Monotonic sequence number, scoped to this daemon's event log.
        id:
          type: string
          description: Stable event id, useful for compatibility cursors.
          examples: [event-1]
        session_id:
          type: string
          examples: [session-1]
        kind:
          $ref: '#/components/schemas/EventKind'
        payload_json:
          type: string
          description: |
            Event payload, encoded as a JSON string. Shape depends on `kind`.
            Decode client-side rather than mixing schemas across kinds.
          examples:
            - "{\"data\":\"hello\"}"
        created_at:
          type: string
          format: date-time

    EventKind:
      type: string
      description: |
        - `output`: data written by the harness PTY (stdout/stderr combined).
        - `input`: data forwarded via `/sessions/{id}/input`.
        - `status`: session status transitions.
        - `exit`: harness process exit notification.
        - `kill`: a live kill was accepted.
        - `capabilities.refreshed`: emitted by `coven.capabilities.refresh`.
      enum:
        - output
        - input
        - status
        - exit
        - kill
        - capabilities.refreshed

    EventCursor:
      type: object
      description: |
        Cursor returned by `/events`. Persist `afterSeq` to resume from the
        same point after a daemon restart.
      required: [afterSeq]
      properties:
        afterSeq:
          type: integer
          minimum: 0
          examples: [42]

    ErrorEnvelope:
      type: object
      description: |
        Standard structured error envelope. All API failures use this shape.
        Clients should branch on `error.code`, not message text.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable diagnostic; do not parse.
            details:
              type: object
              description: Structured details specific to the error code. May be empty.
              additionalProperties: true
      examples:
        - error:
            code: session_not_found
            message: Session was not found.
            details:
              sessionId: session-1

    ErrorCode:
      type: string
      description: |
        Stable daemon error code. Branch client behavior on this value:
        - `not_found` (404): Route not found.
        - `invalid_request` (400/404): Malformed request, unsupported API version, or unknown control action.
        - `session_not_found` (404): Session id does not exist.
        - `session_not_live` (409): Session exists but cannot accept input or kill (not running in this daemon).
        - `project_root_violation` (400): cwd resolves outside the declared project root.
        - `unknown_familiar` (400): `familiarId` does not match a configured familiar.
        - `launch_failed` (500): The harness session could not be launched (missing harness CLI, missing auth, spawn failure); the session row is marked `failed`.
        - `send_input_failed` (500): The runtime failed to forward input to a live session.
        - `session_id_conflict` (409): `POST /sessions/external` targeted an id owned by a daemon-managed session.
        - `not_external_session` (422): `POST /sessions/{id}/complete` targeted a daemon-managed session.
        - `raw_artifact_requires_raw_flag` (400): Artifact read without the explicit `raw=1` acknowledgement.
        - `raw_artifacts_disabled` (403): Raw artifact persistence is not enabled in the privacy configuration.
        - `artifact_not_found` (404): No such sensitive artifact for this session.
        - `artifact_expired` (404): The sensitive artifact exists but has passed its expiry.
        - `pty_spawn_failed` (500): Reserved. Harness PTY could not be launched.
        - `runtime_unavailable` (503): The session runtime is unavailable.
        - `internal_error` (500): Unexpected internal daemon error.
      enum:
        - not_found
        - invalid_request
        - session_not_found
        - session_not_live
        - project_root_violation
        - unknown_familiar
        - launch_failed
        - send_input_failed
        - session_id_conflict
        - not_external_session
        - raw_artifact_requires_raw_flag
        - raw_artifacts_disabled
        - artifact_not_found
        - artifact_expired
        - pty_spawn_failed
        - runtime_unavailable
        - internal_error
