# Additive correction layer applied by scripts/build-openapi-samples.mjs.
# The base document remains openapi/coven.daemon.v1.yaml; this overlay keeps
# the live action-router contract reviewable without duplicating the full spec.

paths:
  /actions:
    post:
      description: |
        Accepts a top-level action id plus optional correlation fields and
        action-specific fields. Legacy action fields are top-level; the
        versioned `coven.automations.command.v1` action carries its command
        object in `envelope`. The daemon routes only known action ids; unknown
        actions fail closed before an adapter can run.

        `accepted: true` means the router recognized and routed the request. An
        adapter can still report an operation-level failure in
        `event.payload.error`; callers must inspect the payload before declaring
        success.

        Known action ids are discovered from `GET /capabilities`. Automation
        mutation and sensitive-read actions require owner-local IPC; TCP remains
        limited to scheduling and health diagnostics. Versioned command clients
        should read the advertised variant-negotiation profile and refuse
        unsupported variants rather than silently downgrading.

        The current daemon advertises `coven.capabilities.refresh` and:
        - `coven.automations.list`
        - `coven.automations.get`
        - `coven.automations.create`
        - `coven.automations.update`
        - `coven.automations.delete`
        - `coven.automations.definition.list.v1`
        - `coven.automations.definition.get.v1`
        - `coven.automations.command.v1`
        - `coven.automations.definition.create.v1`
        - `coven.automations.definition.revise.v1`
        - `coven.automations.definition.disable.v1`
        - `coven.automations.definition.activate.v1`
        - `coven.automations.definition.pause.v1`
        - `coven.automations.definition.tombstone.v1`
        - `coven.automations.run.cancel.v1`
        - `coven.automations.events.read.v1`
        - `coven.automations.events.subscribe.v1`
        - `coven.automations.tick`
        - `coven.automations.runs`
        - `coven.automations.run.history.v1`
        - `coven.automations.receipt.get.v1`
        - `coven.automations.run`
        - `coven.automations.import`
        - `coven.automations.legacy.import.v1`
        - `coven.automations.health`
        - `coven.automations.definition.health.v1`
        - `coven.automations.scheduler.status.v1`
        - `coven.automations.occurrence.list.v1`
        - `coven.automations.occurrence.get.v1`
        - `coven.automations.run.get.v1`
        - `coven.automations.occurrence.history.v1`
        - `coven.automations.unquarantine`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
            examples:
              refreshCapabilities:
                summary: Refresh capability discovery
                value:
                  action: coven.capabilities.refresh
                  origin: coven-client
                  intentId: refresh-1
              automationHealth:
                summary: Inspect one Coven automation
                value:
                  action: coven.automations.health
                  origin: local-maintainer-tool
                  intentId: inspect-daily-notes-1
                  id: daily-notes
              createPausedAutomation:
                summary: Create a reviewed, paused automation
                value:
                  action: coven.automations.create
                  origin: local-maintainer-tool
                  definition:
                    schemaVersion: 1
                    id: daily-notes
                    name: Daily notes
                    status: PAUSED
                    rrule: FREQ=DAILY;BYHOUR=9
                    timezone: utc
                    misfire: latest
                    overlap: forbid
                    timeoutMinutes: 30
                    runtime: coven-code
                    cwd: /absolute/path/to/project
                    prompt: Write the daily reflection.

components:
  schemas:
    Capabilities:
      examples:
        - capabilities:
            - id: coven.control.actions
              label: Coven control-plane action router
              adapter: coven-daemon
              status: available
              policy: allow
              actions: [coven.capabilities.refresh]
            - id: coven.automations
              label: Coven-native routine automations
              adapter: coven-daemon
              status: available
              policy: allow
              actions:
                - coven.automations.list
                - coven.automations.get
                - coven.automations.create
                - coven.automations.update
                - coven.automations.delete
                - coven.automations.definition.list.v1
                - coven.automations.definition.get.v1
                - coven.automations.command.v1
                - coven.automations.definition.create.v1
                - coven.automations.definition.revise.v1
                - coven.automations.definition.disable.v1
                - coven.automations.definition.activate.v1
                - coven.automations.definition.pause.v1
                - coven.automations.definition.tombstone.v1
                - coven.automations.run.cancel.v1
                - coven.automations.events.read.v1
                - coven.automations.events.subscribe.v1
                - coven.automations.tick
                - coven.automations.runs
                - coven.automations.run.history.v1
                - coven.automations.receipt.get.v1
                - coven.automations.run
                - coven.automations.import
                - coven.automations.legacy.import.v1
                - coven.automations.health
                - coven.automations.definition.health.v1
                - coven.automations.scheduler.status.v1
                - coven.automations.occurrence.list.v1
                - coven.automations.occurrence.get.v1
                - coven.automations.run.get.v1
                - coven.automations.occurrence.history.v1
                - coven.automations.unquarantine
            - id: desktop.automation
              label: Desktop automation adapters
              adapter: desktop-use
              status: planned
              policy: requiresApproval
              actions: []

    Capability:
      properties:
        variantNegotiation:
          type: object
          description: Optional machine-readable supported, experimental, and refused variant profile. Clients must not guess or silently downgrade unsupported variants.
          additionalProperties: true

    ActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          minLength: 1
          description: Known action id advertised by `GET /capabilities`.
          examples: [coven.automations.health]
        origin:
          type: string
          minLength: 1
          description: Optional caller identifier echoed for correlation.
          examples: [local-maintainer-tool]
        intentId:
          type: string
          minLength: 1
          description: Optional caller-supplied correlation id echoed in the event.
          examples: [inspect-daily-notes-1]
        id:
          type: string
          minLength: 1
          description: Required by get, delete, runs, run, and health automation actions.
          examples: [daily-notes]
        limit:
          type: integer
          description: Optional recent-run limit for `coven.automations.runs`; defaults to 20.
          examples: [20]
        definition:
          type: object
          description: Routine definition for legacy create and update actions. Versioned command actions carry their closed command envelope in `envelope`.
          additionalProperties: true
        envelope:
          type: object
          description: Versioned `coven.automations.v1` command envelope for `coven.automations.command.v1`.
          additionalProperties: true
      additionalProperties: true
      examples:
        - action: coven.automations.health
          origin: local-maintainer-tool
          intentId: inspect-daily-notes-1
          id: daily-notes

    ActionResponse:
      type: object
      required: [ok, accepted, action, status]
      properties:
        ok:
          type: boolean
        accepted:
          type: boolean
          description: Whether the router recognized and accepted the action envelope.
        action:
          type: string
          description: Echo of the action id that was routed.
        status:
          type: string
          enum: [completed, rejected]
        reason:
          type: string
          description: Rejection reason when the router fails closed.
        event:
          oneOf:
            - $ref: '#/components/schemas/ActionEvent'
            - type: 'null'
      examples:
        - ok: true
          accepted: true
          action: coven.automations.health
          status: completed
          event:
            kind: automations.changed
            action: coven.automations.health
            origin: local-maintainer-tool
            intentId: inspect-daily-notes-1
            payload:
              health:
                automationId: daily-notes

    ActionEvent:
      type: object
      required: [kind, action, payload]
      properties:
        kind:
          type: string
          description: Event kind produced by the routed action.
          examples: [automations.changed]
        action:
          type: string
          description: Echo of the action id.
        origin:
          type: string
          description: Optional echo of the caller identifier.
        intentId:
          type: string
          description: Optional echo of the caller correlation id.
        payload:
          type: object
          description: Action-specific result payload. Inspect `error` before declaring operation success.
          additionalProperties: true
