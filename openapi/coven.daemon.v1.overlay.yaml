# Additive correction layer applied by scripts/build-openapi-samples.mjs.
# The base document remains openapi/coven.daemon.v1.yaml; this overlay keeps
# the live action-router contract reviewable without duplicating the full spec.

paths:
  /actions:
    post:
      description: |
        Accepts a top-level action id plus optional correlation fields and
        action-specific top-level fields. The daemon routes only known action
        ids; unknown actions fail closed before an adapter can run.

        A successful action returns `ok: true`, `accepted: true`, and
        `status: completed`. Unversioned actions and automation reads return
        their data in `event.payload`; versioned automation commands, event
        pages, receipt reads, and `coven.automations.command.v1` return it in
        `result`. A failed action returns `ok: false`, `accepted: false`,
        `status: rejected`, and `reason`. Versioned automation actions and the
        owner-local check also return a typed `error`; the HTTP status equals
        `error.httpStatus`. Unversioned automation failures use `400`.
        `accepted: true` on `coven.automations.run` does not mean the run
        finished.

        Automation actions require owner-local IPC. Over the optional loopback
        TCP listener, only `coven.automations.health`,
        `coven.automations.definition.health.v1`,
        `coven.automations.scheduler.status.v1`,
        `coven.automations.occurrence.list.v1`, and
        `coven.automations.occurrence.history.v1` answer. Every other
        `coven.automations.*` id returns `403` with `AUTHORITY_REQUIRED`
        before the daemon opens the store.

        Known action ids are discovered from `GET /capabilities`. The current
        daemon advertises `coven.capabilities.refresh` and:
        - `coven.automations.list`
        - `coven.automations.get`
        - `coven.automations.create`
        - `coven.automations.update`
        - `coven.automations.delete`
        - `coven.automations.definition.list.v1`
        - `coven.automations.definition.get.v1`
        - `coven.automations.command.v1`
        - `coven.automations.definition.create.v1`
        - `coven.automations.definition.revise.v1`
        - `coven.automations.definition.disable.v1`
        - `coven.automations.definition.activate.v1`
        - `coven.automations.definition.pause.v1`
        - `coven.automations.definition.tombstone.v1`
        - `coven.automations.run.cancel.v1`
        - `coven.automations.occurrence.recover.v1`
        - `coven.automations.occurrence.runNow.v1`
        - `coven.automations.occurrence.cancel.v1`
        - `coven.automations.attempt.cancel.v1`
        - `coven.automations.events.read.v1`
        - `coven.automations.events.subscribe.v1`
        - `coven.automations.tick`
        - `coven.automations.runs`
        - `coven.automations.run.history.v1`
        - `coven.automations.receipt.get.v1`
        - `coven.automations.run`
        - `coven.automations.import`
        - `coven.automations.legacy.import.v1`
        - `coven.automations.health`
        - `coven.automations.definition.health.v1`
        - `coven.automations.scheduler.status.v1`
        - `coven.automations.occurrence.list.v1`
        - `coven.automations.occurrence.get.v1`
        - `coven.automations.run.get.v1`
        - `coven.automations.occurrence.history.v1`
        - `coven.automations.unquarantine`

        Versioned automation command names this daemon does not implement,
        such as `coven.automations.attempt.retry.v1`, are not advertised and
        return `422` with `CAPABILITY_UNSUPPORTED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
            examples:
              refreshCapabilities:
                summary: Refresh capability discovery
                value:
                  action: coven.capabilities.refresh
                  origin: coven-client
                  intentId: refresh-1
              automationHealth:
                summary: Inspect one Coven automation
                value:
                  action: coven.automations.health
                  origin: local-maintainer-tool
                  intentId: inspect-daily-notes-1
                  id: daily-notes
              createPausedAutomation:
                summary: Create a reviewed, paused automation
                value:
                  action: coven.automations.create
                  origin: local-maintainer-tool
                  definition:
                    schemaVersion: 1
                    id: daily-notes
                    name: Daily notes
                    status: PAUSED
                    rrule: FREQ=DAILY;BYHOUR=9
                    timezone: local
                    misfire: latest
                    overlap: forbid
                    timeoutMinutes: 30
                    runtime: coven-code
                    cwd: /absolute/path/to/project
                    prompt: Write the daily reflection.
              activateAutomation:
                summary: Activate a reviewed automation at a known revision
                value:
                  action: coven.automations.definition.activate.v1
                  id: daily-notes
                  adoptionKey: activate-daily-notes-0001
                  expectedRevision: 1
                  reason: Reviewed prompt, cwd, and schedule.
      responses:
        '400':
          $ref: '#/components/responses/ActionRejected'
        '403':
          $ref: '#/components/responses/ActionRejected'
        '404':
          $ref: '#/components/responses/ActionRejected'
        '409':
          $ref: '#/components/responses/ActionRejected'
        '410':
          $ref: '#/components/responses/ActionRejected'
        '422':
          $ref: '#/components/responses/ActionRejected'
        '500':
          $ref: '#/components/responses/ActionRejected'

components:
  responses:
    ActionRejected:
      description: |
        The action was rejected; `reason` explains why. Versioned automation
        actions and the owner-local check also return a typed `error`:
        `VALIDATION_FAILED` or `SCHEMA_VERSION_UNSUPPORTED` (400),
        `AUTHORITY_REQUIRED` (403), `NOT_FOUND` (404), `REVISION_CONFLICT`,
        `ADOPTION_REPLAY_MISMATCH`, or `CANCEL_PENDING` (409),
        `GONE_TOMBSTONED` or `CURSOR_EXPIRED` (410), `CAPABILITY_UNSUPPORTED`
        or `ILLEGAL_TRANSITION` (422), and `INTERNAL` (500). Unknown action
        ids, malformed bodies, and unversioned automation failures return
        `400` with `reason` only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionResponse'
          example:
            ok: false
            accepted: false
            action: coven.automations.definition.activate.v1
            status: rejected
            reason: Automation mutations require owner-local IPC.
            error:
              code: AUTHORITY_REQUIRED
              httpStatus: 403
              message: Automation mutations require owner-local IPC.
              retryable: false

  schemas:
    Capabilities:
      description: |
        Catalog of capabilities advertised by this daemon. The
        `coven.automations` entry also carries `variantNegotiation`, omitted
        from this example.
      examples:
        - capabilities:
            - id: coven.control.actions
              label: Coven control-plane action router
              adapter: coven-daemon
              status: available
              policy: allow
              actions: [coven.capabilities.refresh]
            - id: coven.automations
              label: Coven-native routine automations
              adapter: coven-daemon
              status: available
              policy: allow
              actions:
                - coven.automations.list
                - coven.automations.get
                - coven.automations.create
                - coven.automations.update
                - coven.automations.delete
                - coven.automations.definition.list.v1
                - coven.automations.definition.get.v1
                - coven.automations.command.v1
                - coven.automations.definition.create.v1
                - coven.automations.definition.revise.v1
                - coven.automations.definition.disable.v1
                - coven.automations.definition.activate.v1
                - coven.automations.definition.pause.v1
                - coven.automations.definition.tombstone.v1
                - coven.automations.run.cancel.v1
                - coven.automations.occurrence.recover.v1
                - coven.automations.occurrence.runNow.v1
                - coven.automations.occurrence.cancel.v1
                - coven.automations.attempt.cancel.v1
                - coven.automations.events.read.v1
                - coven.automations.events.subscribe.v1
                - coven.automations.tick
                - coven.automations.runs
                - coven.automations.run.history.v1
                - coven.automations.receipt.get.v1
                - coven.automations.run
                - coven.automations.import
                - coven.automations.legacy.import.v1
                - coven.automations.health
                - coven.automations.definition.health.v1
                - coven.automations.scheduler.status.v1
                - coven.automations.occurrence.list.v1
                - coven.automations.occurrence.get.v1
                - coven.automations.run.get.v1
                - coven.automations.occurrence.history.v1
                - coven.automations.unquarantine
            - id: desktop.automation
              label: Desktop automation adapters
              adapter: desktop-use
              status: planned
              policy: requiresApproval
              actions: []

    Capability:
      properties:
        variantNegotiation:
          type: object
          additionalProperties: true
          description: |
            Present only on `coven.automations`: the packaged
            `coven.automations.v1` variant profile with `version`,
            `contractProfile`, `supported`, `experimental`, `refused`, and
            `negotiationRules`. Read it before authoring definitions; versioned
            create and revise refuse unsupported variants with
            `CAPABILITY_UNSUPPORTED`.

    ActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          minLength: 1
          description: Known action id advertised by `GET /capabilities`.
          examples: [coven.automations.health]
        origin:
          type: string
          minLength: 1
          description: Optional caller identifier echoed for correlation. Grants no authority.
          examples: [local-maintainer-tool]
        intentId:
          type: string
          minLength: 1
          description: |
            Optional caller-supplied correlation id echoed in the event. On
            `coven.automations.create`, `.update`, and `.delete` it is also an
            idempotency key: a repeat returns the first result, and a different
            request with the same value is rejected.
          examples: [inspect-daily-notes-1]
        id:
          type: string
          minLength: 1
          description: |
            Definition, run, occurrence, or receipt id. Required by get, delete,
            runs, run, health, unquarantine, the definition get, health,
            activate, pause, disable, and tombstone commands, `run.get.v1`,
            `occurrence.get.v1`, and `receipt.get.v1`.
          examples: [daily-notes]
        limit:
          type: integer
          description: |
            Optional page size. `coven.automations.runs` defaults to 20;
            history and occurrence reads accept 1 to 100 (default 20);
            `events.read.v1` accepts 1 to 1000 (default 100).
          examples: [20]
        definition:
          type: object
          description: Required routine definition for create, update, and the versioned create and revise commands.
          additionalProperties: true
        adoptionKey:
          type: string
          minLength: 8
          maxLength: 200
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          description: |
            Idempotency key required by versioned automation mutations. The
            same request with the same key returns the first outcome; a
            different request with a used key is rejected.
          examples: [activate-daily-notes-0001]
        expectedRevision:
          type: integer
          minimum: 1
          description: Required by revise, activate, pause, disable, and tombstone; forbidden on create. A stale value returns `REVISION_CONFLICT`.
          examples: [1]
        reason:
          type: string
          description: Optional reason for activate, pause, and disable (at most 500 bytes). Required by `run.cancel.v1`.
        automationId:
          type: string
          minLength: 1
          description: Required by `run.history.v1` and `occurrence.history.v1`; optional filter for `occurrence.list.v1`.
        cursor:
          type: string
          description: Opaque `cursor.next` value from a previous history page.
      additionalProperties: true
      examples:
        - action: coven.automations.health
          origin: local-maintainer-tool
          intentId: inspect-daily-notes-1
          id: daily-notes

    ActionResponse:
      type: object
      required: [ok, accepted, action, status]
      properties:
        ok:
          type: boolean
        accepted:
          type: boolean
          description: Whether the action was accepted. A failed operation returns `false`.
        action:
          type: string
          description: Echo of the action id that was routed.
        status:
          type: string
          enum: [completed, rejected]
        reason:
          type: string
          description: Why the action was rejected, or a replay note.
        result:
          type: object
          additionalProperties: true
          description: Result of versioned automation commands, event pages, receipt reads, and `coven.automations.command.v1`.
        error:
          $ref: '#/components/schemas/AutomationError'
        event:
          oneOf:
            - $ref: '#/components/schemas/ActionEvent'
            - type: 'null'
      examples:
        - ok: true
          accepted: true
          action: coven.automations.health
          status: completed
          event:
            kind: automations.changed
            action: coven.automations.health
            origin: local-maintainer-tool
            intentId: inspect-daily-notes-1
            payload:
              health:
                automationId: daily-notes
        - ok: false
          accepted: false
          action: coven.automations.definition.activate.v1
          status: rejected
          reason: Automation mutations require owner-local IPC.
          error:
            code: AUTHORITY_REQUIRED
            httpStatus: 403
            message: Automation mutations require owner-local IPC.
            retryable: false

    AutomationError:
      type: object
      description: Typed Coven Automations error returned by versioned automation actions and the owner-local transport check.
      required: [code, httpStatus, message, retryable]
      properties:
        code:
          type: string
          enum:
            - SCHEMA_VERSION_UNSUPPORTED
            - VALIDATION_FAILED
            - ADOPTION_REPLAY_MISMATCH
            - REVISION_CONFLICT
            - NOT_FOUND
            - GONE_TOMBSTONED
            - CAPABILITY_UNSUPPORTED
            - ILLEGAL_TRANSITION
            - AUTHORITY_REQUIRED
            - APPROVAL_REQUIRED
            - CANCEL_PENDING
            - OVERLAP_FORBIDDEN
            - RETRY_DISPOSITION_INVALID
            - AMBIGUOUS_RETRY_FORBIDDEN
            - CURSOR_EXPIRED
            - STREAM_OUT_OF_ORDER
            - PAYLOAD_TOO_LARGE
            - DEADLINE_EXCEEDED
            - CONCURRENCY_LIMIT
            - INTERNAL
        httpStatus:
          type: integer
          description: HTTP status mapped from `code`; the response uses the same status.
        message:
          type: string
          description: Human-readable diagnostic; do not parse.
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
        adoption:
          type: object
          additionalProperties: true
          description: Adoption context on some adoption-key rejections.
        currentRevision:
          type: integer
          minimum: 1
          description: Stored revision, for example on `REVISION_CONFLICT`.

    ActionEvent:
      type: object
      required: [kind, action, payload]
      properties:
        kind:
          type: string
          description: Event kind produced by the routed action.
          examples: [automations.changed, automations.run.cancellation]
        action:
          type: string
          description: Echo of the action id.
        origin:
          type: string
          description: Optional echo of the caller identifier.
        intentId:
          type: string
          description: Optional echo of the caller correlation id.
        payload:
          type: object
          description: |
            Action-specific result payload. On `coven.automations.run`, an
            `error` beside status `running` means Coven kept runtime ownership
            but could not confirm the launch; treat the run as unresolved.
          additionalProperties: true
